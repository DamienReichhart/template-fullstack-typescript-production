# Production PostgreSQL. Replaces the postgresql.conf initdb writes to the data directory: what
# that file set and matters is repeated here. Size memory for the host, not for a laptop.

listen_addresses = '*'
port = 5432
max_connections = 100
unix_socket_directories = '/var/run/postgresql'

# Who may connect from where: the api, worker and migrator addresses only.
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# Memory: ~25% of the RAM given to the container for shared_buffers, ~75% for the cache estimate.
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB

# Durability and checkpoints.
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# Logs to stderr, collected by Docker like every other service.
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500ms
log_lock_waits = on
log_temp_files = 0

# Defaults initdb would have written.
datestyle = 'iso, mdy'
timezone = 'UTC'
log_timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
dynamic_shared_memory_type = posix
