# Who may connect, from where. Every network client is a fixed address on the compose network
# (the *_IP variables of .env): change an address there and here together.
#
# TYPE  DATABASE  USER  ADDRESS            METHOD

# Inside the container: the image's entrypoint (first boot) and pg_isready.
local   all       all                      scram-sha-256
host    all       all   127.0.0.1/32       scram-sha-256

# migrator (MIGRATOR_IP), api (API_IP), worker (WORKER_IP).
host    all       all   192.168.250.20/32  scram-sha-256
host    all       all   192.168.250.30/32  scram-sha-256
host    all       all   192.168.250.31/32  scram-sha-256
