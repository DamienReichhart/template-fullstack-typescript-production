# Edge proxy: cloudflared → nginx → web, api, s3. The only service cloudflared reaches.
#
# Routing is on the first label of the Host header, so one static file serves any domain (the
# image has no shell to template it): `api.*` → api, `s3.*` → object storage, anything else
# → web. Point example.com, api.example.com and s3.example.com at the tunnel.
#
# Upstream and cloudflared addresses are the static ones of .env (*_IP): change both together.

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;
daemon off;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  # Read-only root filesystem: every temporary file goes to the /tmp tmpfs.
  client_body_temp_path /tmp/nginx-client_body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # Only cloudflared (CLOUDFLARED_IP) may say who the visitor is: Cloudflare's CF-Connecting-IP.
  set_real_ip_from 192.168.250.51;
  real_ip_header CF-Connecting-IP;

  upstream web {
    server 192.168.250.40:3000; # WEB_IP
    keepalive 16;
  }
  upstream api {
    server 192.168.250.30:4000; # API_IP
    keepalive 16;
  }
  upstream s3 {
    server 192.168.250.12:9000; # S3_IP
    keepalive 16;
  }

  # Keep-alive to upstreams needs an empty Connection header, except on a WebSocket upgrade.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }
  # Cloudflare terminates TLS: visitors always arrive over HTTPS.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' https;
  }

  proxy_http_version 1.1;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Upgrade $http_upgrade;
  # S3 signatures cover the Host browsers used, port included: it reaches RustFS unchanged.
  proxy_set_header Host $http_host;
  # Exactly one forwarded hop, the visitor: the api trusts one proxy (TRUST_PROXY=true), so a
  # client-sent X-Forwarded-For can never pick the address its rate limit counts against.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # Web: everything that is neither api nor s3.
  server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 1m;

    location / {
      proxy_pass http://web;
    }
  }

  # Api: JSON only; files never go through it (ADR 0013).
  server {
    listen 8080;
    server_name ~^api\.;
    client_max_body_size 1m;

    location / {
      proxy_pass http://api;
    }
  }

  # Object storage: presigned uploads and downloads, streamed both ways. The bucket's presigned
  # policy caps each upload (avatars: 5 MB); this cap only bounds what reaches RustFS at all.
  server {
    listen 8080;
    server_name ~^s3\.;
    client_max_body_size 25m;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
      proxy_pass http://s3;
    }
  }

  # Healthcheck, container-local.
  server {
    listen 127.0.0.1:8081;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }
  }
}
