# Production Redis: BullMQ queues, rate-limit counters. Reached only on the compose network.
# The password comes from the command line (`--requirepass ${REDIS_PASSWORD}`), never this file.

bind 0.0.0.0
port 6379
protected-mode yes
dir /data
logfile ""
loglevel notice

# BullMQ requires `noeviction`: an evicted job key is a silently lost job.
maxmemory-policy noeviction

# Durability: every write in the append-only file, fsynced each second, plus periodic snapshots.
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000

# Commands that wipe or inspect the server have no business in production.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
