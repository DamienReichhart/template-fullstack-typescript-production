# Development Redis: no password, reachable from the host. Same queue semantics as production.

bind 0.0.0.0
port 6379
protected-mode no
dir /data
logfile ""
loglevel notice

# BullMQ requires `noeviction`: an evicted job key is a silently lost job.
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
