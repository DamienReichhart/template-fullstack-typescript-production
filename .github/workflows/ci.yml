name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # nx-set-shas reads the last successful run on main to set the affected base on push.
  actions: read

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false
  # Emails land in the Redis capture outbox, where the e2e suites read them.
  MAIL_TRANSPORT: capture
  JWT_ACCESS_SECRET: ci-only-secret-that-is-long-enough-for-hs256-signing

# Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them current.
jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - run: bun run format:check
      - run: bun run check:structure
      - run: bun run check:server-logic
      - run: bunx nx sync:check
      - run: bunx nx affected -t lint typecheck test build

  integration:
    name: Integration tests (Postgres, Redis, RustFS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - run: docker compose up -d --wait
      # Suites share one test database and one test bucket: serial, as locally.
      - run: bunx nx affected -t test:int --parallel=1

  e2e:
    name: End-to-end (api, worker, web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - run: docker compose up -d --wait
      # The bucket, its CORS and lifecycle rules: what `bun run storage:provision` does locally.
      - run: bun run storage:provision
      - name: Install Chromium
        working-directory: apps/web-e2e
        run: bunx playwright install --with-deps chromium
      # Both suites start the stack on the same ports: one at a time.
      - run: bunx nx affected -t e2e --parallel=1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web-e2e/playwright-report
            apps/web-e2e/test-results
          retention-days: 7

  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { image: migrator, dockerfile: apps/api/Dockerfile, target: migrator }
          - { image: worker, dockerfile: apps/worker/Dockerfile, target: runtime }
          - { image: scheduler, dockerfile: apps/scheduler/Dockerfile, target: runtime }
          - { image: web, dockerfile: apps/web/Dockerfile, target: runtime }
    # Builds only: a Dockerfile that breaks is caught here, not at release time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
            NEXT_PUBLIC_SITE_URL=https://www.example.com
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
