version: 2
# A release must age a week before an update proposes it: most compromised packages are pulled
# within days. Security updates ignore the cooldown.
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # Packages released together move together: one PR per family keeps the lockfile coherent.
    groups:
      nx:
        patterns: ['nx', '@nx/*']
      nestjs:
        patterns: ['@nestjs/*', 'nestjs-*']
      next-react:
        patterns: ['next', '@next/*', 'react', 'react-dom', '@types/react*', 'next-intl']
      prisma:
        patterns: ['prisma', '@prisma/*']
      lint-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', '@typescript-eslint/*']
      testing:
        patterns: ['@playwright/*', '@testing-library/*', 'happy-dom', '@happy-dom/*']
    ignore:
      # TypeScript 7 drops the JS API typescript-eslint and Next rely on (see docs/adr).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: ['/docker/dev/images', '/docker/prod/images']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ['*']
