name: Setup
description: Bun, Node and dependencies, plus the root .env every project reads.
inputs:
  nx-cache:
    description: Key for the Nx task cache restored and saved around the job (none when empty).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
    # Bun's download cache, not node_modules: install scripts (Prisma engines, husky) still run.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
    # Values from .env.example; the workflow env overrides secrets and the mail transport.
    - name: Create .env
      shell: bash
      run: cp .env.example .env
    # Nx hashes every task's inputs, so a stale cache is safe: it only misses. The index lives in
    # workspace-data, the outputs in NX_CACHE_DIRECTORY (.nx/cache): both are needed for a hit.
    - if: inputs.nx-cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .nx/cache
          .nx/workspace-data
        key: nx-${{ runner.os }}-${{ inputs.nx-cache }}-${{ github.sha }}
        restore-keys: nx-${{ runner.os }}-${{ inputs.nx-cache }}-
