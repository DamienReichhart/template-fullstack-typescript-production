# Local infrastructure only. The apps run on the host (`bun run dev`);
# each app also ships a production Dockerfile under apps/<app>/Dockerfile.
name: template

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-template}
      POSTGRES_DB: ${POSTGRES_DB:-template}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires `noeviction`: an evicted job key is a silently lost job.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. Buckets, CORS and lifecycle rules are not created here:
  # `bun run storage:provision` applies them from the app's own configuration.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-template}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-template-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
      # No phone-home at boot; logs to stdout, like every other service.
      RUSTFS_CHECK_UPDATES: 'false'
      RUSTFS_OBS_LOG_DIRECTORY: ''
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - '${RUSTFS_PORT:-9000}:9000' # S3 API
      - '${RUSTFS_CONSOLE_PORT:-9001}:9001' # web console at /rustfs/console/
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
